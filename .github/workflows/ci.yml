name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip Pillow

      # The skill is supposed to be portable: no absolute machine paths, LF endings.
      # These three run from a clean checkout and would fail on either mistake.
      - name: Run the test suite
        run: python tests/test_cast_studio.py

      - name: Verify the character registry and every master image hash
        run: python tools/build-cast-registry.py --check

      - name: Validate the bundled example assignment
        run: python scripts/manage-run.py validate-assignment --assignment references/example-assignment.json

      - name: List the registry
        run: python scripts/manage-run.py probe-registry
